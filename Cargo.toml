[package]
name = "euph"
version = "0.3.3"
edition = "2024"
license = "MIT"
description = "A functional stack-based programming language"
repository = "https://github.com/molarmanful/euphrates"
readme = "README.md"
keywords = ["language", "stack", "functional", "euphrates"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:ctrlc", "dep:rustyline"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "euph"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
winnow = "1.0.2"
derive_more = { version = "2.1.1", features = [
  "debug",
  "display",
  "from",
  "is_variant",
  "try_from",
  "try_unwrap",
] }
phf = { version = "0.14.0", features = ["macros"] }
num-traits = "0.2.19"
crabtime = { version = "1.1.4" }
hipstr = "0.8.0"
anyhow = "1.0.102"
itertools = "0.15.0"
imbl = "7.0.0"
ecow = "0.3.0"
dyn-clone = "1.0.20"
ordered-float = "5.3.0"
dashu-int = { version = "0.6.0", features = ["num-traits"] }
wit-bindgen = "0.61.1"
ordermap = "1.2.0"
rand = "0.10.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.6.1", features = ["derive"], optional = true }
rustyline = { version = "18.0.0", optional = true }
ctrlc = { version = "3.5.2", optional = true }

[build-dependencies]
itertools = "0.15.0"

[lints.clippy]
pedantic = "warn"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = "symbols"
